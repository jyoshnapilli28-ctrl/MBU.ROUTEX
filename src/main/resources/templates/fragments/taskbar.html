<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <nav class="taskbar" th:fragment="taskbar(role)">

    <!-- ── Left: Logo ── -->
    <div class="taskbar-left">
      <a th:href="@{/}" class="taskbar-logo" title="MBU RouteX">
        <img th:src="@{/assets/brand/logo-full-nav.png}" alt="MBU RouteX" class="taskbar-logo-img">
      </a>
    </div>

    <!-- ── Center: Navigation Links ── -->
    <div class="taskbar-nav">
      <a th:href="@{/{r}/dashboard(r=${role})}" class="taskbar-nav-item taskbar-nav-home" id="nav-home">
        <!-- Home icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Home</span>
      </a>
      <a th:href="@{/{r}/notifications(r=${role})}" class="taskbar-nav-item" id="nav-notifications">
        <!-- Bell icon -->
        <span class="nav-icon-wrap" style="position:relative; display:inline-flex; align-items:center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
          </svg>
          <span class="nav-badge" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount}">3</span>
          <span class="nav-badge" th:if="${unreadCount == null}">3</span>
        </span>
        <span>Notifications</span>
      </a>
      <a th:href="@{/{r}/live-track(r=${role})}" class="taskbar-nav-item" id="nav-track" th:if="${role == 'student'}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
        </svg>
        <span>Track Updates</span>
      </a>
      <a th:href="@{/driver/bus-status}" class="taskbar-nav-item" id="nav-track-driver" th:if="${role == 'driver'}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
        </svg>
        <span>Track Updates</span>
      </a>
      <a th:href="@{/management/trips}" class="taskbar-nav-item" id="nav-track-mgmt" th:if="${role == 'management'}">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
        </svg>
        <span>Track Updates</span>
      </a>
    </div>

    <!-- ── Right: User Profile (Dropdown Container) ── -->
    <div class="taskbar-right">
      <div class="taskbar-user" id="taskbar-user-menu">
        <!-- Avatar circle -->
        <div class="taskbar-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <!-- Role + ID -->
        <div class="taskbar-user-info">
          <span class="taskbar-user-role" th:text="${displayRole != null ? displayRole : (#strings.capitalize(role))}">Student</span>
          <span class="taskbar-user-id" th:text="${displayId != null ? displayId : (role == 'student' ? 'AP25110010120' : (role == 'driver' ? 'DRV2511005' : 'MGT2511001'))}">AP25110010120</span>
        </div>
        <!-- Chevron dropdown indicator -->
        <div class="taskbar-chevron">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <!-- Quick profile dropdown -->
        <div class="taskbar-dropdown-menu">
          <a th:href="@{/{r}/profile(r=${role})}" class="dropdown-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
            </svg>
            My Profile
          </a>
          <div class="dropdown-divider"></div>
          <form th:action="@{/logout}" method="post" style="margin: 0; width: 100%;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="dropdown-item logout-item" style="width: 100%; border: none; background: none; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              Sign Out
            </button>
          </form>
        </div>
      </div>
    </div>

  </nav>
</body>
</html>
