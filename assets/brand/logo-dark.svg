<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" role="img" aria-label="MBU RouteX Logo">
  <!-- Symbol: stylized route mark with road, curve, and pin -->
  <g transform="translate(6,6)">
    <!-- Outer M/X route shape -->
    <path d="M4 36L12 8l10 16 10-16 8 28" stroke="#577376" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Road curve -->
    <path d="M4 40 Q22 48 40 40" stroke="#8BA7A8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Road markings -->
    <line x1="14" y1="44" x2="18" y2="44" stroke="#C5D3D4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="46" x2="26" y2="45" stroke="#C5D3D4" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Location pin -->
    <path d="M36 16c0 6-6 10-6 10s-6-4-6-10a6 6 0 0 1 12 0z" fill="#698F92" stroke="#577376" stroke-width="1"/>
    <circle cx="30" cy="16" r="2" fill="white"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="28" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2d3748" letter-spacing="0.5">MBU RouteX</text>
  <text x="61" y="44" font-family="Inter,Arial,sans-serif" font-size="7.5" font-weight="500" fill="#577376" letter-spacing="2.5">TRACK · TRAVEL · CONNECT</text>
</svg>
