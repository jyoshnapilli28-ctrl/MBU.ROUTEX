<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" role="img" aria-label="MBU RouteX">
  <!--
    MBU RouteX Full Logo — Primary (for light backgrounds)
    Locked design. DO NOT MODIFY.
    Symbol: actual PNG file is the master — use logo-primary.png in production
    This SVG provides a fallback/CSS-colorable version only.
  -->

  <!-- Symbol (60x60 embedded) -->
  <g transform="translate(0,10) scale(0.5)">
    <!-- Left wing -->
    <polygon points="10,110 10,55 38,10 55,40 38,65 55,90" fill="#4a6568"/>
    <!-- Right wing -->
    <polygon points="110,110 110,55 82,10 65,40 82,65 65,90" fill="#577376"/>
    <!-- Base -->
    <polygon points="10,110 55,90 65,90 110,110" fill="#698F92"/>
    <!-- Road -->
    <path d="M18,108 Q45,70 65,50 Q85,30 98,14" stroke="white" stroke-width="10"
          stroke-linecap="round" fill="none" opacity="0.22"/>
    <!-- Road dashes -->
    <path d="M25,102 Q48,74 64,54 Q80,36 92,22" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="6,5" fill="none"/>
    <!-- Pin -->
    <path d="M95 8 C89 8 85 13 85 18 C85 25 95 34 95 34 C95 34 105 25 105 18 C105 13 101 8 95 8z"
          fill="#698F92"/>
    <circle cx="95" cy="18" r="3.5" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="36" font-family="Inter,Arial,sans-serif" font-size="22"
        font-weight="700" fill="#2d3748" letter-spacing="0.3">MBU RouteX</text>
  <text x="69" y="54" font-family="Inter,Arial,sans-serif" font-size="8"
        font-weight="500" fill="#577376" letter-spacing="3">TRACK · TRAVEL · CONNECT</text>
</svg>
