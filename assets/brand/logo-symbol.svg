<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="MBU RouteX Symbol">
  <!--
    MBU RouteX Logo Symbol
    Locked design: M/X angular route shape, curved road with dashes, location pin
    Colors: Teal gradient (#577376 to #8BA7A8), white road markings
    DO NOT MODIFY — Locked visual identity
  -->

  <!-- Left wing of M/X — dark teal -->
  <polygon points="10,110 10,55 38,10 55,40 38,65 55,90" fill="#4a6568"/>

  <!-- Right wing of M/X — slightly lighter teal -->
  <polygon points="110,110 110,55 82,10 65,40 82,65 65,90" fill="#577376"/>

  <!-- Bottom base connectors -->
  <polygon points="10,110 55,90 65,90 110,110" fill="#698F92"/>

  <!-- Curved road crossing diagonally through symbol -->
  <path d="M18,108 Q45,70 65,50 Q85,30 98,14"
        stroke="white" stroke-width="10" stroke-linecap="round"
        fill="none" opacity="0.22"/>

  <!-- Road dashed center markings -->
  <path d="M25,102 Q48,74 64,54"
        stroke="white" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="6,5" fill="none"/>
  <path d="M64,54 Q80,36 92,22"
        stroke="white" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="6,5" fill="none"/>

  <!-- Location pin at top-right -->
  <circle cx="95" cy="17" r="9" fill="#8BA7A8"/>
  <path d="M95 8 C89 8 85 13 85 18 C85 25 95 34 95 34 C95 34 105 25 105 18 C105 13 101 8 95 8z"
        fill="#698F92"/>
  <circle cx="95" cy="18" r="3.5" fill="white"/>
</svg>
